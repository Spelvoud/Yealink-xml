; Dialplan voor de parkeerplaatsen.
;
; Asterisk maakt de context [parkedcalls] (700 en 701-710 met hints) zelf aan
; vanuit res_parking.conf. Je hoeft die alleen bereikbaar te maken vanuit de
; context van je toestellen. Voeg in /etc/asterisk/extensions.conf toe:
;
;   #include extensions_parking.conf
;
; en zet in de context van je toestellen (de 'context' van het pjsip-endpoint
; of de sip-peer):
;
;   include => parking-intern
;
; Herlaad daarna: asterisk -rx "dialplan reload"

[parking-intern]
include => parkedcalls

; --- Cisco (usecallmanager.nz-patch) -------------------------------------
; Gebaseerd op de pagina Dialplan Extensions van usecallmanager.nz.
;
; Functies van de Cisco-toestellen komen binnen als x-cisco-serviceuri-<naam>.
; Haal het voorvoegsel eraf en ga naar de extensie <naam>. Staat deze regel al
; in je dialplan (bv. voor pickup of cfwdall), voeg hem dan niet nog eens toe.
; [x] staat tussen haken omdat een losse x in een patroon "elk cijfer" is.
exten => _[x]-cisco-serviceuri-.,1,Goto(${EXTEN:19},1)

; Park-softkey. De patch zoekt de extensie 'park' in de context van het toestel
; en parkeert met de argumenten van Park(). Mogelijke opties, bv.
; Park(default,t(60)c(intern,200,1)): na 60 s naar de receptie (200).
exten => park,1,Park(default)

; Parkeertoetsen (BLF Directed Call Park, featureID 22). Is de plaats vrij, dan
; verbindt het toestel het gesprek blind door naar x-cisco-serviceuri-dpark-701
; en komt het hier als dpark-701. PARKINGEXTEN kiest de plaats (is die net
; bezet, dan neemt Asterisk de volgende vrije).
exten => _dpark-.,1,Set(PARKINGEXTEN=${EXTEN:6})
 same => n,Goto(park,1)

; Voorbeeld: interne nummers 2XX bellen met parkeren via #72 toegestaan.
; Vergelijk met je eigen dialplan en voeg vooral de opties kK toe aan Dial().
;   K = de beller mag het gesprek parkeren
;   k = de gebelde mag het gesprek parkeren
;   t/T = doorverbinden met DTMF (optioneel)
;
; [intern]
; include => parking-intern
; exten => _2XX,1,Dial(PJSIP/${EXTEN},30,kK)
;  same => n,Hangup()
;
; Inkomende gesprekken (trunk) laten parkeren door de medewerker die opneemt:
; exten => s,1,Dial(PJSIP/201&PJSIP/202,30,k)
;
; Alternatief zonder Dial-opties aan te passen, aan het begin van elke
; gespreksroute:
;  same => n,Set(__BRIDGE_FEATURES=kK)

; Wordt gebruikt als comebacktoorigin = no: het gesprek gaat na de parkeertijd
; naar de receptie (pas het nummer aan).
[parkedcallstimeout]
exten => _X.,1,NoOp(Parkeertijd verlopen voor ${PARKINGSLOT})
 same => n,Dial(PJSIP/200,30)
 same => n,Hangup()
