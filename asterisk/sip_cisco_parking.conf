; Cisco-toestellen met SIP enterprise-firmware op chan_sip met de
; usecallmanager.nz-patch. Dit is geen volledig sip.conf: vergelijk met je
; eigen peers en neem de instellingen onder "Parkeren" over.
;
; Herlaad daarna: asterisk -rx "sip reload"

[cisco-parking](!)              ; template, gebruik als [201](cisco-parking)
type = friend
context = intern                ; context met include => parking-intern
subscribecontext = intern       ; hier zoekt Asterisk de hints voor BLF
allowsubscribe = yes            ; nodig voor BLF op 701-710
dtmfmode = rfc2833              ; alleen nodig voor #72

; Parkeren
cisco = yes                     ; Cisco-functies aan, nodig voor de Park-softkey.
                                ; Oudere patchversies: cisco_usecallmanager = yes
parkinglot = default            ; parking lot uit res_parking.conf
parknotifytimer = 5             ; seconden dat "geparkeerd op 701" in beeld staat

; Voorbeeld:
; [201](cisco-parking)
; secret = ...
; callerid = "Anna de Vries" <201>
