; Instellingen die de toestellen nodig hebben voor parkeren en BLF.
; Dit is geen volledig endpoint: vergelijk met je eigen pjsip.conf.

[201]
type = endpoint
context = intern            ; context waarin include => parking-intern staat
dtmf_mode = rfc4733         ; nodig voor #72 (Yealink: RFC2833, Cisco: AVT)
allow_subscribe = yes       ; standaard yes; nodig voor BLF op 701-710
; subscribe_context = intern ; alleen als BLF-hints in een andere context staan
; aors, auth, allow, ... zoals je al had
