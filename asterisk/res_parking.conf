; Parkeerplaatsen (call park) voor Asterisk 13 of hoger (res_parking).
;
; Kopieer naar /etc/asterisk/res_parking.conf of voeg de [default]-sectie toe
; aan je bestaande bestand. Daarna: asterisk -rx "module reload res_parking.so"
;
;   700        doorverbinden om te parkeren (Asterisk kiest een vrije plaats)
;   701 - 710  parkeerplaatsen; bel het nummer om het gesprek op te halen
;
; Houd deze nummers gelijk aan 'parking' in config.php van de XML app.

[general]
parkeddynamic = no              ; geen parkeerplaatsen on-the-fly aanmaken

[default]
parkext => 700                  ; nummer om naar te parkeren
parkpos => 701-710              ; de parkeerplaatsen
context => parkedcalls          ; Asterisk maakt deze context zelf aan
parkinghints = yes              ; hints park:701@parkedcalls etc. voor BLF
findslot => next                ; volgende vrije plaats i.p.v. steeds de eerste
parkingtime => 120              ; na 120 s terug naar wie parkeerde

comebacktoorigin = yes          ; bij timeout terugbellen naar de parkeerder
comebackdialtime = 30           ; zo lang laten overgaan bij terugbellen
comebackcontext = parkedcallstimeout ; gebruikt als comebacktoorigin = no

parkedmusicclass = default      ; wachtmuziek (musiconhold.conf)
courtesytone = beep             ; piep bij ophalen...
parkedplay = caller             ; ...voor de opgehaalde beller

; Wie mag na het ophalen weer doorverbinden/parkeren met DTMF-codes.
parkedcalltransfers = both
parkedcallreparking = both
parkedcallhangup = no
parkedcallrecording = no
