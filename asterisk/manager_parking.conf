; Optioneel: AMI-gebruiker waarmee de XML app (parking.php) live de bezetting
; van de parkeerplaatsen ophaalt.
;
; Voeg toe aan /etc/asterisk/manager.conf (zorg dat in [general] enabled = yes
; staat) en herlaad: asterisk -rx "manager reload"
;
; Zet daarna in config.php van de XML app:
;   'status_url' => 'ami://yealink-parking:KiesEenSterkWachtwoord@127.0.0.1:5038/default',
; (bijzondere tekens in het wachtwoord URL-encoderen, bv. @ als %40)
;
; Draait de webserver op een andere machine, pas dan permit en het adres in
; status_url aan. Stel AMI nooit open voor internet.

[yealink-parking]
secret = KiesEenSterkWachtwoord
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call
write = call                ; nodig voor de actie ParkedCalls
