; DTMF-code om tijdens een gesprek te parkeren.
;
; Voeg de regel toe aan de [featuremap]-sectie van /etc/asterisk/features.conf
; en herlaad: asterisk -rx "module reload features"
;
; Werkt alleen als:
;  - het gesprek met Dial-optie K (beller) en/of k (gebelde) is opgezet, of
;    BRIDGE_FEATURES deze letters bevat (zie extensions_parking.conf);
;  - DTMF via RFC 4733 loopt (pjsip: dtmf_mode = rfc4733).
;
; Wie #72 intoetst hoort de parkeerplaats en wordt daarna afgemeld; de andere
; partij staat geparkeerd met wachtmuziek.

[featuremap]
parkcall => #72
