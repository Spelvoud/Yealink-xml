#!version:1.0.0.1
## Parkeerplaatsen voor Yealink (T4x/T5x) met Asterisk res_parking.
##
## Voeg deze regels toe aan y000000000000.cfg (alle toestellen) of <mac>.cfg
## (één toestel). Pas de toetsnummers, het IP-adres van de webserver en het
## aantal parkeerplaatsen aan. Toetsnummers die je al gebruikt overschrijf je!
##
##   700        parkeren (doorverbinden)
##   701 - 710  parkeerplaatsen (bellen = ophalen)
##   #72        DTMF-code om tijdens een gesprek te parkeren (features.conf)

## DTMF via RFC 2833, nodig voor #72 (Asterisk: dtmf_mode = rfc4733).
account.1.dtmf.type = 1

## Toets 1: XML app met overzicht van de parkeerplaatsen (parking.php).
linekey.1.type = 27
linekey.1.label = Parkeren
linekey.1.value = http://192.168.1.10/yealink/parking.php

## Toets 2: parkeren tijdens een gesprek. Stuurt #72; Asterisk noemt de
## parkeerplaats en verbreekt daarna jouw kant van het gesprek.
linekey.2.type = 11
linekey.2.line = 1
linekey.2.label = Park
linekey.2.value = #72

## Toets 3 t/m 12: BLF per parkeerplaats. Rood = bezet; indrukken = ophalen.
linekey.3.type = 16
linekey.3.line = 1
linekey.3.label = Park 701
linekey.3.value = 701

linekey.4.type = 16
linekey.4.line = 1
linekey.4.label = Park 702
linekey.4.value = 702

linekey.5.type = 16
linekey.5.line = 1
linekey.5.label = Park 703
linekey.5.value = 703

linekey.6.type = 16
linekey.6.line = 1
linekey.6.label = Park 704
linekey.6.value = 704

linekey.7.type = 16
linekey.7.line = 1
linekey.7.label = Park 705
linekey.7.value = 705

linekey.8.type = 16
linekey.8.line = 1
linekey.8.label = Park 706
linekey.8.value = 706

linekey.9.type = 16
linekey.9.line = 1
linekey.9.label = Park 707
linekey.9.value = 707

linekey.10.type = 16
linekey.10.line = 1
linekey.10.label = Park 708
linekey.10.value = 708

linekey.11.type = 16
linekey.11.line = 1
linekey.11.label = Park 709
linekey.11.value = 709

linekey.12.type = 16
linekey.12.line = 1
linekey.12.label = Park 710
linekey.12.value = 710

## Alternatief voor toets 2 als DTMF niet werkt: blind doorverbinden naar 700.
## De parkeerplaats wordt dan niet genoemd, maar is zichtbaar op de BLF-toetsen.
